<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>RFP 파이프라인 검증(임시)</title>
<link rel="stylesheet" href="style.css?v=20261128x">
<style>body{background:#eef2f7;margin:0}#vBar{position:sticky;top:0;z-index:20;background:#0b2a4a;color:#fff;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font:12px/1.4 system-ui,sans-serif}
#vBar button{font:11px system-ui;padding:4px 9px;border-radius:6px;border:1px solid #ffffff55;background:#ffffff18;color:#fff;cursor:pointer}
#vWrap{max-width:1280px;margin:0 auto;padding:12px}#vLog{font:11px monospace;color:#0f766e;background:#fff;border:1px solid #cfe0fa;border-radius:8px;padding:6px 9px;margin:6px 0;white-space:pre-wrap}</style></head>
<body>
<div id="vBar">
  <b>RFP 파이프라인 검증</b>
  <button data-v="seed">1) 가상 데이터</button>
  <button data-v="staff">2) 운영자 · 제출 폴더</button>
  <button data-v="party">3) 자문사 딜 룸(CA 전)</button>
  <button data-v="ca">4) CA 접수(파일 등록)</button>
  <button data-v="party2">5) 자문사 딜 룸(CA 후)</button>
  <button data-v="inv">6) 투자자 딜 룸</button>
  <button data-v="board">7) 딜 보드</button>
  <button data-v="eval">8) 평가 초안</button>
  <button data-v="xlsx">9) 엑셀 리포트</button>
  <button data-v="clear">초기화</button>
  <input id="caFile" type="file">
</div>
<div id="vWrap"><div id="vLog">준비됨</div><div id="vHost"></div></div>

<script>window.naiToast=function(m,e){document.getElementById('vLog').textContent=String(m)+(e?' (오류)':'');};
window.naiShowView=function(){};
window.naiMap={role:function(){return 'admin';},me:function(){return {name:'검증담당',company:'NAI Korea'};},state:{base:[],index:{}},select:function(){}};
</script>
<script src="config.js?v=20261128x"></script>
<script src="rfp_template.js?v=20261128z"></script>
<script src="rfpcore.js?v=20261128z"></script>
<script src="rfpflow.js?v=20261128z"></script>
<script src="dealroom.js?v=20261128z"></script>
<script src="deals.js?v=20261128z"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
(function(){
  var C=window.NAI_RFPC, host=document.getElementById('vHost'), log=document.getElementById('vLog');
  function say(m){log.textContent=m;}
  var ASSET='vfy-off-1';
  function seed(){
    localStorage.removeItem('nai-map:rfp:v1');
    C.SYNC.checked=false; C.SYNC.mode='local';
    try{localStorage.removeItem('nai-map:rfp:portal:v1');}catch(e){}
    window.naiMap.state.base=[{id:ASSET,name:'샘플 오피스 타워',address:'서울 종로구 창경궁로 120',region:'서울 CBD',sector:'office',price_info:'3,500억',scale_info:'연면적 13,835평 · 14F/B7',lat:37.5709,lng:126.9899,coord_precision:'지번 일치'}];
    window.naiMap.state.index={};window.naiMap.state.index[ASSET]=window.naiMap.state.base[0];
    var rr=[['층','임차인','면적(평)','월 임대료(원)','만기','비고'],['3F','샘플 주식회사 A',1200,'24000000','2029-12-31',''],['4F','샘플테크',980,'19600000','2028-06-30',''],['5F','(공실)',300,'0','','']];
    C.commit('docs',{id:'vfy-rr',asset_id:ASSET,asset_name:'샘플 오피스 타워',kind:'rentroll',label:'렌트롤 (Rent Roll)',name:'샘플_렌트롤.csv',size:2048,mime:'text/csv',rows:rr,summary:C.rentRollSummary(rr),month:'2026-10',access:'기본 개방',at:new Date().toISOString()});
    var ox=[['항목','금액(원/년)','비고'],['관리비','1200000000',''],['수선유지','400000000','']];
    C.commit('docs',{id:'vfy-ox',asset_id:ASSET,asset_name:'샘플 오피스 타워',kind:'opex',label:'오펙스 (OpEx)',name:'샘플_오펙스.csv',size:1024,mime:'text/csv',rows:ox,summary:C.opexSummary(ox,2180),month:'2026-10',access:'기본 개방',at:new Date().toISOString()});
    C.commit('docs',{id:'vfy-im',asset_id:ASSET,asset_name:'샘플 오피스 타워',kind:'im',label:'IM · 티저',name:'샘플_티저.pdf',size:4096,mime:'application/pdf',rows:[],access:'기본 개방',at:new Date().toISOString()});
    C.commit('docs',{id:'vfy-etc',asset_id:ASSET,asset_name:'샘플 오피스 타워',kind:'etc',label:'기타 자료',name:'샘플_감정평가서.pdf',size:8192,mime:'application/pdf',rows:[],access:'요청 시 개방',tags:['감정평가서'],at:new Date().toISOString()});
    var rfp=C.newRfp(ASSET);
    rfp.id='vfy-rfp-1'; rfp.title='샘플 오피스 타워 매각 자문 RFP'; rfp.client='샘플자산운용';
    rfp.material_ids=['vfy-rr','vfy-ox','vfy-im','vfy-etc'];
    C.commit('rfps',rfp);
    C.seedContacts();
    var cs=C.contacts().slice(0,2);
    var invites=[];
    cs.forEach(function(ct,i){
      var adv=C.commit('advisors',{id:'vfy-adv-'+i,company:ct.company,name:ct.name,email:ct.email});
      var code=C.issueCode({rfp_id:rfp.id,holder_type:'자문사',holder:adv.company,holder_id:adv.id,expires_at:C.addDays(C.today(),30)});
      invites.push({advisor_id:adv.id,company:adv.company,name:adv.name,code:code.code,at:new Date().toISOString(),expires_at:code.expires_at,viewed_at:''});
      C.ensureParticipant(rfp.id,'자문사',{ref_id:adv.id,company:adv.company,name:adv.name,email:adv.email});
      C.commit('submissions',{id:'vfy-sub-'+i,rfp_id:rfp.id,advisor_id:adv.id,advisor_company:adv.company,version:1,status:'제출',fee_success:i?0.8:1.1,fee_fixed:i?0.8:0.5,price_expect:i?3420:3640,period_months:i?6:5,track_record:'오피스 매각 3건(3,000억)',access_reach:'FI 40 · SI 25 · 화주 10',team:'전담 5명',schedule:'TM D+20 · LOI D+45',extra:'PF 주선 지원',files:[{name:'제안서_'+adv.company+'.pdf',size:120000}],at:new Date().toISOString()});
    });
    rfp.invites=invites; C.commit('rfps',rfp);
    var inv=C.ensureParticipant(rfp.id,'투자자',{company:'샘플인베스트',name:'샘플담당',email:'buyer@example.com'});
    var bcode=C.issueCode({rfp_id:rfp.id,holder_type:'매수자',holder:'샘플인베스트',holder_id:inv.id,expires_at:C.addDays(C.today(),30)});
    C.commit('submits',{id:'vfy-loi',rfp_id:rfp.id,participant_id:inv.id,company:'샘플인베스트',party_type:'투자자',kind:'LOI',version:1,amount_eok:3300,terms:'실사 30일 · 인수 2027-03',status:'접수',files:[{name:'LOI_샘플인베스트.pdf',size:90000}],at:new Date().toISOString()});
    C.setStatus(C.rfpOf(rfp.id),'분석','검증 시드');
    say('가상 데이터 생성 완료 — RFP: '+C.rfpOf(rfp.id).title+' · 참여자 '+C.participantsOf(rfp.id).length+'명 · 제안 '+C.submissionsOf(rfp.id).length+'건\n자문사 코드 '+invites[0].code+' / 투자자 코드 '+bcode.code);
    return {rfp:C.rfpOf(rfp.id), code:invites[0].code, bcode:bcode.code};
  }
  function rfp(){return C.rfpOf('vfy-rfp-1');}
  function setSession(code){var rec=C.findCode(code);C.setSession(rec);return rec;}
  function drawFolder(){
    var r=rfp(); if(!r)return say('먼저 1) 가상 데이터');
    host.innerHTML='<div class="rfp-shell">'+window.NAI_RFPFLOW.html(r.id)+'</div>';
    window.NAI_RFPFLOW.bind(host,r.id,drawFolder); say('운영자 · 제출 폴더');
  }
  function drawRoom(mode,code){
    var r=rfp(); if(!r)return say('먼저 1) 가상 데이터');
    if(code)setSession(code); else C.setSession(null);
    var room={id:'rfp:'+r.id,rfp_id:r.id,name:r.title,asset_name:r.asset_name,asset_id:r.asset_id};
    host.innerHTML='<div class="rfp-shell dr-shell">'+window.NAI_DEALROOM.render(room,{mode:mode})+'</div>';
    window.NAI_DEALROOM.bind(host,room,function(){drawRoom(mode,code);});
    say(mode==='party'?('참여자 모드 — '+(code||'')):'운영자 모드');
  }
  document.getElementById('vBar').addEventListener('click',function(e){
    var b=e.target.closest('[data-v]'); if(!b)return; var a=b.getAttribute('data-v');
    if(a==='seed'){window.__v=seed();}
    else if(a==='staff'){drawFolder();}
    else if(a==='party'){drawRoom('party',window.__v.code);}
    else if(a==='party2'){drawRoom('party',window.__v.code);}
    else if(a==='inv'){drawRoom('party',window.__v.bcode);}
    else if(a==='board'){host.innerHTML='<div class="rfp-shell"><div id="vBoard"></div></div>';window.NAI_DEALS.paint(document.getElementById('vBoard'));say('딜 보드');}
    else if(a==='ca'){
      var f=document.getElementById('caFile').files[0];
      var r=rfp(); var cs=C.contacts().slice(0,1); var adv=C.list('advisors')[0];
      var p=C.findParticipant(r.id,{ref_id:adv.id,company:adv.company});
      var files=[];
      if(f){ files=[{name:f.name,size:f.size,mime:f.type,dataUrl:'',text:''}]; }
      else { files=[{name:'CA_서명본_샘플.pdf',size:210000,mime:'application/pdf',dataUrl:'',text:''}]; }
      C.caReceiptCommit(r.id,p,{manager:adv.name,signed_date:C.today(),status:'CA 접수',files:files});
      say('CA 접수 완료 — '+p.company+' · '+(files[0]?files[0].name:'파일')+'\n'+C.caSummaryOf(r.id).ca+'/'+C.caSummaryOf(r.id).total+' 접수');
      drawRoom('party',window.__v.code);
    }
    else if(a==='eval'){var out=C.draftAllEvaluations(rfp());say('평가 초안 '+out.length+'건 생성 — '+out.map(function(x){return x.company+' '+x.total+'점';}).join(' / '));drawFolder();}
    else if(a==='xlsx'){window.NAI_RFPFLOW.xlsxReport(rfp());say('엑셀 리포트 다운로드 실행');}
    else if(a==='clear'){localStorage.removeItem('nai-map:rfp:v1');C.closeModal&&C.closeModal();host.innerHTML='';say('초기화');}
  });
  say('검증 페이지 준비 — 1)을 누르세요');
})();
</script>
</body></html>
