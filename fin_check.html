<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>재무현황 UI 검증 (임시)</title>
<link rel="stylesheet" href="style.css?v=20261126c">
</head>
<body class="view-pool">
<p style="margin:12px 16px;font-size:12px;color:#b45309">임시 검증 페이지 — 📊 재무현황 렌더 확인용. 확인 후 삭제됩니다.</p>
<section id="poolView" class="pool-view" aria-label="SI·화주 풀">
  <div class="pool-head">
    <div class="pool-title">
      <h2 id="poolTitle">🤝 SI·화주 풀</h2>
      <p id="poolSubtitle">오피스 SI · 물류 화주 — 티저 메일 발송 연계</p>
      <p id="poolMeta" class="pool-meta">불러오는 중…</p>
    </div>
    <div class="pool-tools">
      <button id="poolAddBtn" class="btn btn-primary hidden" type="button">＋ 컨택 추가</button>
      <button id="poolXlsx" class="btn btn-ghost" type="button" title="현재 탭·필터 기준으로 엑셀(.xlsx) 다운로드">📥 엑셀 다운로드</button>
      <button id="poolRefresh" class="btn btn-ghost" type="button">↻ 새로고침</button>
    </div>
  </div>

  <div class="pool-filters">
    <div id="poolKindChips" class="chip-wrap pf-chips"></div>
    <div id="poolStratChips" class="chip-wrap pf-chips hidden"></div>
    <div id="poolRegionChips" class="chip-wrap pf-chips"></div>
    <div class="pf-search">
      <span class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="poolSearch" type="search" autocomplete="off" placeholder="회사 · 업종 · 사례 · 담당자 · 이메일 검색" aria-label="SI·화주·FI 대상 검색">
      </span>
      <label class="pf-toggle"><input id="poolOnlyEmail" type="checkbox"> 이메일 있는 건만</label>
      <label class="pf-toggle" title="5개년 재무현황이 있는 기업만 보기"><input id="poolFinOnly" type="checkbox"> 📊 재무 있는 건만</label>
      <label class="pf-toggle hidden" id="poolFundOnlyWrap"><input id="poolFundOnly" type="checkbox"> 펀드 정보 있는 건만</label>
      <select id="poolOwnerSel" class="pf-owner" aria-label="NAI 담당자 필터" title="NAI 담당자별로 보기">
        <option value="ALL">담당자 전체</option>
        <option value="__NONE__">담당 미지정</option>
      </select>
      <span id="poolResultCount" class="pf-count">0건</span>
      <span class="pf-right">
        <button id="poolSelectAll" class="mini-btn" type="button">결과 전체 선택</button>
        <button id="poolClearSel" class="mini-btn" type="button">선택 해제</button>
      </span>
    </div>
  </div>

  <div id="poolList" class="pool-list" role="list"></div>

  <div id="poolCompose" class="pool-compose">
    <div class="pc-head">
      <strong id="composeTitle">📧 티저 메일 발송</strong>
      <span id="composeHint" class="compose-hint">선택 0건</span>
      <button id="poolComposeToggle" class="mini-btn" type="button">▴ 입력칸 펼치기</button>
    </div>
    <div id="poolComposeFields" class="pc-fields hidden">
      <label class="pc-field pc-subject">티저 제목<input id="mailSubject" type="text" placeholder="예) [NAI Korea] 이천 덕평 물류센터 매각 티저"></label>
      <label class="pc-field pc-link">클라우드 티저 링크<input id="mailLink" type="url" placeholder="https://drive.google.com/..."></label>
      <label class="pc-field pc-msg">간단 메시지<textarea id="mailBody" rows="2" placeholder="예) 관심 있으실 만한 물건이 있어 티저를 보내드립니다. 회신 주시면 상세 자료 보내드리겠습니다."></textarea></label>
    </div>
    <div class="pc-actions">
      <button id="btnMailto" class="btn btn-primary" type="button">📧 선택 대상 메일창 열기</button>
      <button id="btnCopyEmails" class="btn btn-ghost" type="button">📋 이메일 목록 복사</button>
      <button id="btnCopyRequest" class="btn btn-ghost" type="button">🤖 Jk 발송 요청문 복사</button>
    </div>
  </div>
</section>
<div id="poolModal" class="modal hidden"></div>
<div id="toast" class="toast hidden" role="status"></div>
